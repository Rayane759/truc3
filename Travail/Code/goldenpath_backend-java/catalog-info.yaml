apiVersion: scaffolder.backstage.io/v1beta3
kind: Template
metadata:
  name: golden-path-service
  title: Golden Path — Java Service
  description: Create a fully configured Java backend service (GitOps ready)
  tags:
  - java
  - spring-boot
  - recommended
spec:
  owner: team-platform
  type: service

  parameters:
  # -------------------------
  # Page 1
  # -------------------------
  - title: Java Project
    properties:
      buildTool:
        type: string
        title: Build
        default: maven
        enum:
        - maven
        - gradle
        enumNames:
        - Maven
        - Gradle

      javaVersion:
        type: string
        title: Java
        default: "21"
        enum:
        - "21"
        - "17"
        enumNames:
        - Java 21
        - Java 17

      springBootVersion:
        type: string
        title: Spring Boot
        default: "3.3.0"
        enum:
        - "3.3.0"
        - "3.2.0"
        enumNames:
        - "3.3.0"
        - "3.2.0"

      groupId:
        type: string
        title: Groupe
        pattern: '^[a-z][a-z0-9_]*(\.[a-z][a-z0-9_]*)*$'
        description: "ex: ???m"

      artifactId:
        type: string
        title: Nom de l'application
        default: my-service
        pattern: '^[a-z][a-z0-9-]*$'
        description: "ex: my-service (en minuscules, les tirets '-' sont autorisés)"

      features:
        type: array
        title: Fonctionnalités
        description: Choisissez les fonctionnalités à inclure dans votre projet
        uniqueItems: true
        ui:widget: checkboxes
        items:
          type: string
          enum:
          - security
          - observability
          - vault
          enumNames:
          - "Sécurité — Spring Security + Keycloak (OAuth2/OIDC)"
          - "Observabilité — Micrometer + Prometheus + structured logs (Logback JSON)"
          - "Vault — Spring Cloud Vault"

  # -------------------------
  # Page 2
  # -------------------------
  - title: Configuration
    required:
    - name
    - repoUrl
    properties:
      name:
        type: string
        title: Nom du service
        description: "Indiquez le nom de votre service qui apparaîtra dans le catalogue"

      description:
        type: string
        title: Description
        description: Description du service (Ce qu'il fait, ...)

      team:
        type: string
        title: Nom de l'équipe
        description: "Nom de l'équipe responsable du service (ex : team-backend)"
        default: team-backend

      repoUrl:
        type: string
        title: Repository location
        ui:field: RepoUrlPicker
        ui:options:
          allowedHosts:
          - BLABLA.com

  # -------------------------
  # Page 3
  # -------------------------
  - title: Review
    description: |
      Review your configuration before creating the service.
    properties:
      _reviewBuildTool:
        type: string
        title: Build tool
        ui:widget: hidden
      _reviewJava:
        type: string
        title: Java version
        ui:widget: hidden

  steps:
  # -------------------------
  # 1. Generate project
  # -------------------------
  - id: fetch
    name: Generate project
    action: fetch:template
    input:
      url: ./skeleton
      values:
        # Identity
        name: ${{ parameters.name }}
        description: ${{ parameters.description | default("Service generated by Golden Path") }}
        team: ${{ parameters.team }}

        # Java config
        groupId: ${{ parameters.groupId }}
        artifactId: ${{ parameters.artifactId }}
        packagePath: ${{ parameters.groupId | replace(".", "/") }}/${{ parameters.artifactId | replace("-", "") }}
        javaVersion: ${{ parameters.javaVersion }}
        springBootVersion: ${{ parameters.springBootVersion }}
        buildTool: ${{ parameters.buildTool }}

        # Features (booléens dérivés du tableau de features)
        hasSecurity: ${{ "security" in parameters.features }}
        hasObservability: ${{ "observability" in parameters.features }}
        hasVault: ${{ "vault" in parameters.features }}

  # -------------------------
  # 2. Create GitLab repo
  # -------------------------
  - id: publish
    name: Create repository
    action: publish:gitlab
    input:
      repoUrl: ${{ parameters.repoUrl }}
      defaultBranch: main
      description: ${{ parameters.description }}
      settings:
        visibility: internal
        merge_method: merge
        only_allow_merge_if_pipeline_succeeds: true

  # -------------------------
  # 3. Register in Backstage catalog
  # -------------------------
  - id: register
    name: Register in catalog
    action: catalog:register
    input:
      repoContentsUrl: ${{ steps.publish.output.repoContentsUrl }}
      catalogInfoPath: /catalog-info.yaml

  output:
    links:
    - title: Repository
      icon: gitlab
      url: ${{ steps.publish.output.remoteUrl }}
    - title: Open in catalog
      icon: catalog
      entityRef: ${{ steps.register.output.entityRef }}
    text:
    - title: Next steps
      content: |
        Your service **${{ parameters.name }}** has been created.
