default:
  image: gitlab-registry.insee.fr/kubernetes/images/build/maven-jdk-toolbox:21
  tags:
  - docker

stages:
- 🎨 Formatting
- 📦 Build
- 📈 Metrics
- 🔒 Security
- test
- 🚚 Release
- 🚀 Deploy

variables:
  MAVEN_TEST_OPTS: >-
    -Dspring.datasource.driver-class-name=org.h2.Driver -Dspring.datasource.url=jdbc:h2:mem:testdb -Dlogging.level.root=WARN -Dlogging.level.fr.insee=INFO

# Components
include:
# To Be Continuous : Maven Component (alors peut etre)
- component: $CI_SERVER_FQDN/platform-engineering/poc/components/maven-component/gitlab-ci-maven@0.3.0
  inputs:
    image: gitlab-registry.insee.fr:443/kubernetes/images/build/maven-jdk:21
    deploy-enabled: true
- component: gitlab.insee.fr/kubernetes/kubeapp/components/docker/gitlab-ci-docker-lint-component@0.0.2
  inputs:
    stage: "🎨 Formatting"
    path_to_dockerfile: "Dockerfile"
- component: gitlab.insee.fr/kubernetes/kubeapp/components/docker/gitlab-ci-docker-build-component@0.0.2
  inputs:
    stage: "📦 Build"
    path_to_dockerfile: "Dockerfile" # Optionnel
- component: gitlab.insee.fr/dsi/analyzer/composants/gitlab-ci-gitleaks-component/scan@1.0.0
  inputs:
    stage: "🔒 Security"
# - component: gitlab.insee.fr/dsi/analyzer/composants/gitlab-ci-trivy-component/scan@2.0.0
#   inputs:
#     stage: 🔒 Security
#     fail_on_severity: "CRITICAL|HIGH"
#     rules:
#       - when: manual
#         allow_failure: true
- component: gitlab.insee.fr/kubernetes/kubeapp/components/docker/gitlab-ci-docker-check-component@0.0.2
  inputs:
    trivy_path_to_trivyignore: "" # Optionnel
    stage: 🔒 Security
    allow_failure: true
    dependencies: [ docker-build ]
- component: gitlab.insee.fr/kubernetes/kubeapp/components/docker/gitlab-ci-docker-push-component@0.0.2
  inputs:
    stage: 🚚 Release
    push_image_registry: "${CI_REGISTRY_IMAGE}"
    push_image_tags: "${CI_COMMIT_REF_NAME}"
    tar_path: "image.tar"
    dependencies: [ docker-build ]
