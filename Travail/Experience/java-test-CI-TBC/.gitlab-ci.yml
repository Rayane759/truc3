maven-build:
  stage: "📦 Build"
  script:
  - mvn $MAVEN_CLI_OPTS clean verify -DskipTests
  artifacts:
    paths:
    - target/*.jar
  cache:
    key: "$CI_COMMIT_REF_SLUG"
    paths:
    - .m2/repository
  rules:
  - if: $CI_PIPELINE_SOURCE == "merge_request_event"
  - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH

maven-test:
  stage: test
  script:
  - mvn $MAVEN_CLI_OPTS clean verify
  artifacts:
    expire_in: 1 week
    when: always # permet d'avoir le rapport même quand les tests échouent
    paths:
    - ./rapport-cucumber.html
    - ./target/ROOT.jar
    reports:
      junit: ./target/junit.xml
  rules:
  - if: $CI_PIPELINE_SOURCE == "merge_request_event"
  - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH

########################################
# 📈 Metrics — Analyse qualité SonarQube
########################################
sonarqube:
  stage: 📈 Metrics
  script:
  - echo "Analyse SONAR et envoi sur $SONAR_HOST_URL du projet [${CI_PROJECT_PATH}], PROJECT_ID=[${CI_PROJECT_ID}]  ${CI_COMMIT_BRANCH}"
  - >-
    mvn clean verify sonar:sonar -Dsonar.host.url=${SONAR_HOST_URL} -Dsonar.token=${SONAR_TOKEN} -Dsonar.projectKey=${SONAR_PROJECT_KEY} -Dsonar.branch.name=${CI_COMMIT_BRANCH} $MAVEN_TEST_OPTS
  except:
  - tags
  allow_failure: true

sonarqube_mr:
  stage: 📈 Metrics
  script:
  - echo "Analyse SONAR et envoi sur $SONAR_HOST_URL du projet [${CI_PROJECT_PATH}], PROJECT_ID=[${CI_PROJECT_ID}]  ${CI_COMMIT_REF_NAME}"
  - >-
    mvn clean verify sonar:sonar -Dsonar.host.url=$SONAR_HOST_URL -Dsonar.token=$SONAR_TOKEN -Dsonar.projectKey=$SONAR_PROJECT_KEY -Dsonar.pullrequest.key=$CI_MERGE_REQUEST_IID -Dsonar.pullrequest.branch=${CI_COMMIT_REF_NAME} -Dsonar.pullrequest.base=main $MAVEN_TEST_OPTS
  rules:
  - if: "$CI_MERGE_REQUEST_IID"
  allow_failure: true
