    name: team-platform

servers:
- url: /
  description: Serveur courant

tags:
- name: health
  description: Supervision et état du service

paths:
  /actuator/health:
    get:
      tags:
      - health
      summary: État du service
      description: |
        Retourne l'état de santé du service (liveness + readiness).
        Exposé par Spring Boot Actuator.
      operationId: getHealth
      responses:
        "200":
          description: Service opérationnel
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthResponse"
        "503":
          description: Service dégradé ou indisponible
