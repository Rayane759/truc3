apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: app-simple
  namespace: projet-gn93k7
  finalizers:
  - resources-finalizer.argocd.argoproj.io
spec:
  destination:
    namespace: projet-gn93k7
    name: in-cluster
  project: projet-gn93k7
  source:
    path: apps/app-simple
    repoURL: https://gitlab.insee.fr/gn93k7/gitops-template-atelier-kube.git
    targetRevision: main
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
env:
- name: MON_ENV
  value: "Bonjour"
securityContext:
  runAsNonRoot: true
  allowPrivilegeEscalation: false
resources:
  requests:
    cpu: "50m"
    memory: "64Mi"
  limits:
    cpu: "100m"
    memory: "128Mi"
