          - Outils et technologies en place au seins du DPII: contexte/panorama/outils.md
          - Outils de la stack par couches fonctionnelles: contexte/panorama/outils-fonctionnels.md
          - Rôles et responsabilités autour de l’infrastructure et du delivery: contexte/panorama/responsabilite.md
  - Recueil des besoins:
      - Résumé:
          - constat-terrain/index.md
      - Protocole:
          - Proto Personnas: constat-terrain/protocole/proto_personnas.md
          - Protocole: constat-terrain/protocole/protocole.md
          - Scenario:
              - dev: constat-terrain/protocole/interviews/devs/devs.md
              - archis: constat-terrain/protocole/interviews/archis/archi.md
              - secu: constat-terrain/protocole/interviews/secu/secu.md
      - Synthèse:
