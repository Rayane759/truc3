  - Archives:
      - Golden Path (Stage):
          - Qu'est ce qu'un Golden Path ?:
              - golden_path/definition/index.md
          - Organisation:
              - golden_path/schema/index.md
          - Comment construire un bon Golden Path ?:
              - golden_path/comment_faire/index.md
          - De quoi est constitué un Golden Path ?:
              - golden_path/composants/index.md
          - Concrètement:
              - golden_path/concret/index.md
          - POC:
              - golden_path/poc/index.md

plugins:
  - search
  - awesome-pages
  - git-revision-date-localized
  - glightbox

theme:
  name: material
  language: fr
  # Chemins RELATIFS à docs/ (pas de "/" initial, sinon l'URL devient absolue
  # et ignore le préfixe /documentation/ de GitLab Pages -> 404).
  favicon: assets/svg/logo.svg
  logo: assets/svg/logo.svg
  palette:
    # Palette toggle for light mode
    - media: "(prefers-color-scheme: light)"
      scheme: default
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
      primary: light-blue
      accent: blue
    # Palette toggle for dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
      primary: indigo
      accent: blue
  custom_dir: overrides
  features:
    - navigation.instant
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.indexes
    - announce.dismiss
    - navigation.sections
    - navigation.path
    - navigation.top
    # Recherche
    - search.suggest
    - search.highlight
    # Accès rapide pour le modification du code
    - content.action.edit
    - content.action.view
  icon:
    #repo: material/gitlab # icon for git button
    edit: material/file-edit-outline
    view: material/file-eye-outline
markdown_extensions:
  - md_in_html
  - attr_list
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - admonition
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.critic
  - pymdownx.caret
  - pymdownx.keys
  - pymdownx.mark
  - pymdownx.tilde
  - pymdownx.tasklist:
      custom_checkbox: true
  - pymdownx.tabbed:
      alternate_style: true
extra_css:
  - assets/css/extra.css
