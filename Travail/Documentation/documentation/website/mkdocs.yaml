site_name: Platform Engineering
site_url: https://platform-engineering.gitlab-pages.insee.fr/documentation/

# Requis pour afficher les boutons "Modifier cette page" / "Voir le code source"
# (features content.action.edit / content.action.view). Sans repo_url,
# page.edit_url est vide et les deux boutons ne s'affichent pas.
repo_url: https://gitlab.insee.fr/platform-engineering/documentation
repo_name: platform-engineering/documentation
# edit_uri est relatif à repo_url. Le mkdocs.yaml est dans website/, les
# sources sont donc dans website/docs/ à la racine du dépôt.
edit_uri: -/edit/main/website/docs/

